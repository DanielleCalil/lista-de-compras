<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lista de Compras</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body>
    <header class="topo">
      <i class="topo-icone" data-lucide="shopping-cart" aria-hidden="true"></i>
      <h1>Lista de Compras</h1>
      <p class="subtitulo">Organize suas compras e acompanhe o total gasto</p>
    </header>
    <main class="container">
      <section class="card">
        <h2>Adicionar item</h2>
        <form id="form-item">
          <div class="campo campo-nome">
            <label for="nome">Produto</label>
            <input
              type="text"
              id="nome"
              placeholder="Ex.: Arroz"
              required
              maxlength="40"
            />
          </div>
          <div class="campo">
            <label for="quantidade">Qtd.</label>
            <input type="number" id="quantidade" value="1" min="1" required />
          </div>
          <div class="campo">
            <label for="preco">Preço (R$)</label>
            <input
              type="number"
              id="preco"
              placeholder="0,00"
              min="0"
              step="0.01"
            />
          </div>
          <div class="campo">
            <label for="categoria">Categoria</label>
            <select id="categoria">
              <option value="Mercearia">Mercearia</option>
              <option value="Hortifruti">Hortifruti</option>
              <option value="Carnes">Carnes</option>
              <option value="Laticínios">Laticínios</option>
              <option value="Bebidas">Bebidas</option>
              <option value="Limpeza">Limpeza</option>
              <option value="Higiene">Higiene</option>
              <option value="Outros">Outros</option>
            </select>
          </div>
          <button type="submit" class="btn btn-principal" id="btn-salvar">
            Adicionar
          </button>
          <button
            type="button"
            class="btn btn-secundario escondido"
            id="btn-cancelar"
          >
            Cancelar
          </button>
        </form>
        <p id="mensagem" class="mensagem" role="status"></p>
      </section>
      <section class="resumo">
        <div class="resumo-item">
          <span class="resumo-numero" id="total-itens">0</span>
          <span class="resumo-texto">itens</span>
        </div>
        <div class="resumo-item">
          <span class="resumo-numero" id="total-comprados">0</span>
          <span class="resumo-texto">comprados</span>
        </div>
        <div class="resumo-item">
          <span class="resumo-numero" id="valor-total">R$ 0,00</span>
          <span class="resumo-texto">total estimado</span>
        </div>
      </section>
      <div class="barra-progresso" aria-hidden="true">
        <div class="progresso" id="progresso"></div>
      </div>
      <section class="card">
        <div class="cabecalho-lista">
          <h2>Meus itens</h2>
          <input type="search" id="busca" placeholder="Buscar produto..." />
        </div>
        <div class="filtros">
          <button class="filtro ativo" data-filtro="todos">Todos</button>
          <button class="filtro" data-filtro="pendentes">Pendentes</button>
          <button class="filtro" data-filtro="comprados">Comprados</button>
        </div>
        <ul id="lista" class="lista"></ul>
        <p id="lista-vazia" class="lista-vazia">
          Sua lista está vazia. Adicione um item acima! 🥕
        </p>
        <div class="acoes-lista">
          <button class="btn btn-secundario" id="btn-limpar-comprados">
            Remover comprados
          </button>
          <button class="btn btn-perigo" id="btn-limpar-tudo">
            Limpar lista
          </button>
        </div>
      </section>
    </main>
    <footer class="rodape">
      <p>Trabalho P2 — HTML, CSS e JavaScript</p>
    </footer>
    <script src="script.js"></script>
  </body>
</html>
